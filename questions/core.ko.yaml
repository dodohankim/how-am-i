# howami 기본 질문 세트 (한국어)
#
# 이 파일은 데이터다. 진단 로직은 SKILL.md에 있고, 여기에는 무엇을 물을지만 적는다.
# 질문 문구는 그대로 읽어도 되고, 대화 흐름에 맞게 다듬어도 된다.
# 다른 언어나 상황(개발자용·운동·관계 등)의 세트를 추가하려면 이 구조를 그대로 복사하면 된다.

version: 1
lang: ko
name: core
description: 하루를 5개 축으로 훑는 기본 스캔 세트

# ---------------------------------------------------------------------------
# 1단계 스캔 — 전부 묻되 점수만 받는다. 목표 소요 시간 1분.
# ---------------------------------------------------------------------------
scan:
  - key: energy
    label: 에너지
    question: "오늘 몸과 머리의 에너지는 1~5 중 몇 점이었어요?"
    anchors:
      1: "바닥이었다. 앉아 있는 것도 버거웠다"
      3: "그럭저럭 버틸 만했다"
      5: "가볍고 잘 돌아갔다"

  - key: mood
    label: 기분
    question: "기분은 1~5 중 몇 점이었어요?"
    anchors:
      1: "많이 가라앉았다"
      3: "특별히 좋지도 나쁘지도 않았다"
      5: "괜찮았고 여유가 있었다"

  - key: sleep
    label: 수면
    question: "어젯밤 잠은 1~5 중 몇 점이었어요? 시간보다 개운함 기준으로요."
    anchors:
      1: "거의 못 잤거나 자고도 더 피곤했다"
      3: "부족했지만 버틸 만했다"
      5: "푹 자고 개운하게 일어났다"

  - key: execution
    label: 계획 실행
    question: "오늘 하려던 것 중 실제로 해낸 정도는 1~5 중 몇 점이에요?"
    anchors:
      1: "거의 손대지 못했다"
      3: "절반쯤 했다"
      5: "계획한 대로 다 했다"

  - key: social
    label: 관계
    question: "오늘 사람들과의 시간은 1~5 중 몇 점이었어요?"
    anchors:
      1: "불편하거나 외로웠다"
      3: "무난했다"
      5: "든든하고 좋았다"

# ---------------------------------------------------------------------------
# 2단계 탐지 — 낮거나 급락한 항목만 파고든다. 목표 소요 시간 3분.
# CBT 사고기록(상황 → 자동적 사고 → 감정 → 행동)의 순서를 일상 언어로 옮긴 것이다.
# ---------------------------------------------------------------------------
probe:
  trigger:
    - "그게 언제부터였어요? 하루 중 특정 시점이 있었나요?"
    - "그때 무슨 일이 있었는지 상황만 짧게 말해줄래요?"
  thought:
    - "그 순간 머릿속에 스친 생각이 있다면 뭐였어요?"
    - "그 생각을 문장으로 만들면 어떻게 돼요?"
  feeling:
    - "그때 감정에 이름을 붙인다면 뭐에 가까워요?"
  behavior:
    - "그래서 그다음에 뭘 했어요? 혹은 뭘 안 하게 됐어요?"
  why_chain:
    # 5 Whys. 기계적으로 다섯 번 세지 말고, 답이 더 이상 안 쪼개지면 멈춘다.
    - "그건 왜 그랬을까요?"
    - "그 이유의 이유를 한 겹 더 들어가면요?"
  controllability:
    - "지금 말한 원인 중에 내가 바꿀 수 있는 건 어디까지예요?"

# ---------------------------------------------------------------------------
# 3단계 처방 — 내일 바꿀 딱 하나. 목표 소요 시간 1분.
# ---------------------------------------------------------------------------
prescribe:
  - "내일 딱 하나만 다르게 한다면 뭘 해볼래요? 작을수록 좋아요."
  - "그건 내일 언제, 어디서 하게 될까요?"

# ---------------------------------------------------------------------------
# 어제 처방 확인 — 스캔 맨 앞에서 묻는다. 이게 있어야 기록이 루프가 된다.
# ---------------------------------------------------------------------------
follow_up:
  - "어제 정한 건 '{prescription}'이었어요. 오늘 해봤어요?"
  - "했다면 어땠고, 못 했다면 뭐가 걸렸어요?"

# ---------------------------------------------------------------------------
# 위험 신호 — 해당하면 진단을 멈추고 안내한다 (SKILL.md의 안전 규칙 참고).
# ---------------------------------------------------------------------------
safety:
  watch_for:
    - 자해나 죽음에 대한 생각
    - 2주 이상 이어지는 낮은 점수
    - 일상 기능이 무너진 상태 (출근·식사·위생)
  message: >-
    howami는 의료 기기나 심리 치료 도구가 아닙니다.
    지금 말한 상태가 2주 넘게 이어지거나 견디기 어렵다면 전문가와 상담하는 게 좋겠어요.
