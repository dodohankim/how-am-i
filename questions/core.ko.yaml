# howami 기본 질문 세트 (한국어)
#
# 이 파일은 데이터다. 진행 로직은 SKILL.md에 있고, 여기에는 무엇을 물을지만 적는다.
# 질문 문구는 그대로 읽어도 되고, 대화 흐름에 맞게 다듬어도 된다.
# 다른 언어나 상황의 세트를 추가하려면 이 구조를 그대로 복사하면 된다.
#
# 세션 종류는 둘이다.
#   session  하루 전체를 여러 관점으로 펼쳐 보는 긴 대화 (10~15분)
#   checkin  지금 이 순간만 짧게 짚는 대화 (2~3분). 하루에 몇 번이든 할 수 있다.

version: 2
lang: ko
name: core
description: 하루를 생활 영역별로 펼쳐 보고 하나를 깊이 다루는 상담식 질문 세트

flow:
  session: [open, map, domain_scan, state_scan, focus, probe, validate, prescribe, close]
  checkin: [open_now, state_scan, focus, prescribe, close]

# ---------------------------------------------------------------------------
# 0. 여는 질문 — 점수부터 묻지 않는다. 사용자의 말로 하루가 먼저 나오게 한다.
#    같은 날 이미 기록이 있으면 first 대신 again을 쓴다.
# ---------------------------------------------------------------------------
open:
  first:
    - "오늘 하루 어떻게 흘러갔어요? 순서대로 정리하지 않아도 되니까 떠오르는 대로 편하게 말해 주세요."
    - "그중에 제일 오래 남아 있는 장면은 뭐예요?"
  again:
    - "아까 {time}에 얘기했을 때는 {summary} 이런 상태였어요. 그 뒤로 하루는 어떻게 흘러갔어요?"
    - "그때 말한 것 중에 지금은 달라진 게 있어요?"

open_now:
  - "지금 상태부터 짧게 볼게요. 지금 어떤 상태예요?"
  - "방금 전까지 뭘 하고 있었어요?"

# ---------------------------------------------------------------------------
# 1. 하루 지도 — 자유 서술을 시간과 영역으로 갈라서 되비추고 확인받는다.
#    여기서 사용자가 고치는 것이 이후 분석의 전제가 된다.
# ---------------------------------------------------------------------------
map:
  reflect:
    - "정리해 볼게요. 아침에는 {morning}, 낮에는 {day}, 저녁에는 {evening} 이렇게 흘러간 것 같은데 맞아요?"
    - "제가 잘못 짚었거나 빠뜨린 게 있으면 고쳐 주세요."
  fill_gap:
    - "{domain} 쪽은 아직 얘기가 안 나왔는데, 오늘 그쪽은 어땠어요?"
    - "오늘 그 영역은 별일 없었어요, 아니면 얘기할 만한 게 있었어요?"

# ---------------------------------------------------------------------------
# 생활 영역 — 하루를 나누는 관점이다. 사용자의 삶에 맞게 조정할 수 있다.
#   key      기록과 DB에 그대로 들어가는 id
#   when     보통 하루 중 언제 겪는 영역인지 (질문 순서를 잡는 데 쓴다)
#   default  기본 세션에서 항상 묻는 영역인지
# ---------------------------------------------------------------------------
domains:
  - key: family
    label: 가족
    when: 아침·저녁
    default: true
    question: "오늘 가족과 보낸 시간은 1~5 중 몇 점이었어요?"
    probe_hint: "같이 있던 시간, 나눈 대화, 남은 감정"

  - key: work
    label: 일
    when: 낮
    default: true
    question: "오늘 일하는 시간은 1~5 중 몇 점이었어요?"
    probe_hint: "일의 양, 사람, 성과, 통제감"

  - key: solo
    label: 혼자 있는 시간
    when: 아침·밤
    default: true
    question: "오늘 혼자 있던 시간은 1~5 중 몇 점이었어요? 시간이 아예 없었으면 그렇게 말해 주세요."
    probe_hint: "쉬었는지, 하고 싶던 걸 했는지, 그냥 흘려보냈는지"

  - key: people
    label: 사람들
    when: 하루 전체
    default: true
    question: "가족과 직장 밖에서 만난 사람들과의 시간은 1~5 중 몇 점이었어요?"
    probe_hint: "친구, 연락, 혼자라고 느꼈는지"

  - key: body
    label: 몸
    when: 하루 전체
    default: true
    question: "오늘 몸 상태는 1~5 중 몇 점이었어요? 잠·식사·움직임을 다 포함해서요."
    probe_hint: "수면, 끼니, 통증, 움직인 정도"

  # 아래는 기본에서 빠져 있다. 사용자가 그 영역을 자주 얘기하면 그때부터 물으면 된다.
  - key: study
    label: 공부
    when: 하루 전체
    default: false
    question: "오늘 공부하거나 배운 시간은 1~5 중 몇 점이었어요?"
    probe_hint: "집중, 진도, 막힌 지점"

  - key: money
    label: 돈
    when: 하루 전체
    default: false
    question: "오늘 돈과 관련해서 마음이 어땠어요? 1~5 중 몇 점이에요?"
    probe_hint: "지출, 불안, 계획"

  - key: side
    label: 내 일
    when: 밤
    default: false
    question: "회사 일 말고 내가 하려던 작업은 오늘 1~5 중 몇 점이었어요?"
    probe_hint: "손댔는지, 진도, 미룬 이유"

# ---------------------------------------------------------------------------
# 2. 영역별 스캔 — 점수만 받는다. 여기서는 파고들지 않는다.
#    점수가 애매하면 anchors를 읽어 준다.
# ---------------------------------------------------------------------------
domain_scan:
  anchors:
    1: "많이 힘들거나 거의 망가진 상태였다"
    3: "그럭저럭, 특별히 좋지도 나쁘지도 않았다"
    5: "충분히 좋았다"
  skip: "오늘 그 영역이 아예 없었으면 건너뛰어도 돼요."
  one_line:
    - "그 점수를 그렇게 준 이유를 한 줄로 말한다면요?"

# ---------------------------------------------------------------------------
# 3. 상태 스캔 — 영역과 별개로 하루 전체를 관통하는 축이다. 짧게 점수만 받는다.
# ---------------------------------------------------------------------------
state_scan:
  - key: energy
    label: 에너지
    question: "오늘 몸과 머리의 에너지는 1~5 중 몇 점이었어요?"
    anchors:
      1: "바닥이었다. 앉아 있는 것도 버거웠다"
      3: "그럭저럭 버틸 만했다"
      5: "가볍고 잘 돌아갔다"

  - key: mood
    label: 기분
    question: "기분은 1~5 중 몇 점이었어요?"
    anchors:
      1: "많이 가라앉았다"
      3: "특별히 좋지도 나쁘지도 않았다"
      5: "괜찮았고 여유가 있었다"

  - key: sleep
    label: 수면
    question: "어젯밤 잠은 1~5 중 몇 점이었어요? 시간보다 개운함 기준으로요."
    anchors:
      1: "거의 못 잤거나 자고도 더 피곤했다"
      3: "부족했지만 버틸 만했다"
      5: "푹 자고 개운하게 일어났다"

  - key: execution
    label: 계획 실행
    question: "오늘 하려던 것 중 실제로 해낸 정도는 1~5 중 몇 점이에요?"
    anchors:
      1: "거의 손대지 못했다"
      3: "절반쯤 했다"
      5: "계획한 대로 다 했다"

# ---------------------------------------------------------------------------
# 4. 초점 정하기 — 오늘 깊이 볼 하나를 사용자가 고른다.
# ---------------------------------------------------------------------------
focus:
  offer:
    - "오늘은 {candidates} 쪽이 눈에 띄는데, 어느 쪽을 더 얘기해 볼까요?"
    - "다른 걸 얘기하고 싶으면 그쪽으로 가도 좋아요."
  none:
    - "오늘은 특별히 걸리는 데가 없어 보여요. 그래도 더 들여다보고 싶은 데가 있어요?"

# ---------------------------------------------------------------------------
# 5. 탐색 — 고른 하나를 깊이 본다. 전부 묻지 말고 상황에 맞는 갈래만 고른다.
#    trigger → thought → feeling → behavior 순서가 CBT 사고기록의 뼈대다.
# ---------------------------------------------------------------------------
probe:
  trigger:
    - "그게 언제부터였어요? 하루 중 특정 시점이 있었나요?"
    - "그때 무슨 일이 있었는지 상황만 짧게 말해 줄래요?"
  thought:
    - "그 순간 머릿속에 스친 생각이 있다면 뭐였어요?"
    - "그 생각을 문장으로 만들면 어떻게 돼요?"
  feeling:
    - "그때 감정에 이름을 붙인다면 뭐에 가까워요? 답답함, 서운함, 조급함처럼요."
    - "그 감정이 10점 만점이면 몇 점쯤이었어요?"
  behavior:
    - "그래서 그다음에 뭘 했어요? 혹은 뭘 안 하게 됐어요?"
  distortion:
    # 인지 왜곡 확인. 라벨을 붙이지 말고 질문으로만 짚는다.
    - "그 생각이 '항상' 이나 '절대' 같은 말로 되어 있진 않아요?"
    - "상대가 어떻게 생각했는지는 확인한 거예요, 아니면 짐작이에요?"
  evidence:
    - "그 생각이 맞다고 볼 근거는 뭐가 있어요?"
    - "반대로 그 생각과 어긋나는 사실도 하나 있다면요?"
  why_chain:
    # 5 Whys. 기계적으로 다섯 번 세지 말고, 답이 더 이상 안 쪼개지면 멈춘다.
    - "그건 왜 그랬을까요?"
    - "그 이유의 이유를 한 겹 더 들어가면요?"
  exception:
    - "같은 상황인데 괜찮았던 날도 있었어요? 그날은 뭐가 달랐어요?"
  values:
    - "그게 그만큼 불편했다는 건, 그쪽이 그만큼 중요하다는 뜻일 수도 있어요. 뭐가 걸린 거예요?"
  compassion:
    # 자책이 강할 때만 쓴다. 위로하려 들지 말고 질문으로 둔다.
    - "같은 일을 겪은 친구가 그 얘기를 했다면 뭐라고 해줬을 것 같아요?"
    - "그 말을 오늘의 자신한테도 해줄 수 있어요?"
  controllability:
    - "지금 말한 원인 중에 내가 바꿀 수 있는 건 어디까지예요?"

# ---------------------------------------------------------------------------
# 6. 검증 — 해석을 사용자에게 돌려주고 확인받는다. 이 단계를 건너뛰지 않는다.
#    사용자가 아니라고 하면 사용자의 정정이 항상 이긴다.
# ---------------------------------------------------------------------------
validate:
  summary:
    - "지금까지 나온 걸 정리하면 이래요. {summary} 이렇게 보는 게 맞아요?"
    - "어디가 어긋나요? 그 부분만 고쳐 주세요."
  spillover:
    - "{from_domain}에서 있었던 일이 {to_domain}까지 넘어간 것 같기도 한데, 그렇게 느꼈어요?"
    - "아니면 둘은 따로였어요?"
  alternative:
    - "같은 일을 이렇게 볼 수도 있을 것 같아요. {alternative} 이쪽은 어때요?"
    - "둘 중에 어느 쪽이 실제에 더 가까워요?"

# ---------------------------------------------------------------------------
# 7. 처방 — 다음 한 걸음. 하루에 여러 번 하는 세션이면 '내일'이 아니라
#    '다음번까지'로 시간 단위를 좁힌다.
# ---------------------------------------------------------------------------
prescribe:
  ask:
    - "여기서 하나만 다르게 한다면 뭘 해볼래요? 작을수록 좋아요."
    - "그건 언제, 어디서 하게 될까요?"
  too_big:
    - "그건 조금 커 보이는데, 오늘 안에 확실히 할 수 있는 크기로 줄이면 뭐가 될까요?"

# ---------------------------------------------------------------------------
# 잘 지나간 날 — 팔 것이 없는 날에도 남길 것은 있다.
# ---------------------------------------------------------------------------
good_day:
  - "오늘 괜찮았던 건 뭐 때문이었어요? 하나만 꼽는다면요."
  - "그게 다음에도 되게 하려면 뭐가 있어야 해요?"

# ---------------------------------------------------------------------------
# 8. 마무리
# ---------------------------------------------------------------------------
close:
  - "오늘은 여기까지 할게요. 남기기 전에 한 번 읽어 드릴게요."
  - "이대로 저장해도 될까요?"

# ---------------------------------------------------------------------------
# 위험 신호 — 해당하면 진행을 멈추고 안내한다 (SKILL.md의 안전 규칙 참고).
# ---------------------------------------------------------------------------
safety:
  watch_for:
    - 자해나 죽음에 대한 생각
    - 2주 이상 이어지는 낮은 점수
    - 일상 기능이 무너진 상태 (출근·식사·위생)
  message: >-
    howami는 의료 기기나 심리 치료 도구가 아닙니다.
    지금 말한 상태가 2주 넘게 이어지거나 견디기 어렵다면 전문가와 상담하는 게 좋겠어요.
