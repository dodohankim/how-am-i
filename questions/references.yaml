# howami 기법별 기대 효과와 외부 출처
#
# 이 파일은 데이터다. methods.yaml 의 id 마다 "이 기법을 쓰면 무엇을 기대할 수 있는지"와
# 더 읽어볼 권위 있는 출처 링크를 적는다. 웹 화면(scripts/serve.py)이 /api/methods 에
# 합쳐서 내준다.
#
# 필드
#   effect     기대 효과. 한두 문장. 치료 효과를 단정하지 않고 "무엇에 도움이 되는지"만 적는다
#   links      더 읽을 곳. label 은 화면에 보이는 이름, url 은 주소, source 는 출처 종류
#              label_en 은 영어 화면용 이름 (한국어 label 에만 붙인다)
#              source: wikipedia | apa | who | nhs | nimh | stanford | iep | official | other
#
# 링크는 추가하기 전에 실제로 열리는지 확인한다 (2026-08-28 기준 전부 200 응답).
# 한국어 위키백과에 해당 문서가 없는 항목은 영어 문서만 걸었다.
#
# 주의: 여기 적힌 출처는 "더 읽어보기"일 뿐이다. howami 는 치료 도구가 아니며,
# 각 기법은 임상 절차를 일상 언어로 옮겨 참고하는 것에 그친다.

version: 1

# 화면 아래에 항상 보여주는 공통 출처
general:
  - label: WHO — 정신 건강
    label_en: WHO — Mental health
    url: https://www.who.int/health-topics/mental-health
    source: who
  - label: WHO — 정신 건강 대응 강화 (팩트시트)
    label_en: WHO — Strengthening our response (fact sheet)
    url: https://www.who.int/news-room/fact-sheets/detail/mental-health-strengthening-our-response
    source: who
  - label: NIMH — 심리치료 개요
    label_en: NIMH — Psychotherapies overview
    url: https://www.nimh.nih.gov/health/topics/psychotherapies
    source: nimh
  - label: APA — 심리치료란
    label_en: APA — What is psychotherapy
    url: https://www.apa.org/topics/psychotherapy
    source: apa
  - label: 국가정신건강정보포털 (보건복지부)
    label_en: National Mental Health Portal (Korea MOHW)
    url: https://www.mentalhealth.go.kr/
    source: official

references:
  open_question:
    effect:
      ko: 점수부터 묻지 않아서 사용자가 실제로 신경 쓰는 일이 먼저 드러난다. 대화의 주도권이 사용자에게 남고, 이후 질문이 엉뚱한 곳을 파지 않게 된다.
      en: Surfaces what actually matters before any scoring, keeping the user in charge of the conversation.
    links:
      - { label: 위키백과 — Motivational interviewing, label_en: Wikipedia — Motivational interviewing, url: "https://en.wikipedia.org/wiki/Motivational_interviewing", source: wikipedia }
      - { label: SAMHSA TIP 35 — 동기 강화 (미국 보건부 산하), label_en: SAMHSA TIP 35 — Enhancing motivation for change, url: "https://store.samhsa.gov/product/tip-35-enhancing-motivation-change-substance-use-disorder-treatment/pep19-02-01-003", source: official }
      - { label: MINT — 동기면담 이해하기, label_en: MINT — Understanding Motivational Interviewing, url: "https://motivationalinterviewing.org/understanding-motivational-interviewing", source: official }

  reflective_listening:
    effect:
      ko: 들은 말을 정리해 되돌려주면 사용자가 자기 상황을 한 발 떨어져 보게 되고, 어긋난 이해를 그 자리에서 바로잡을 수 있다. 이해받고 있다는 느낌이 대화를 이어가게 한다.
      en: Reflecting back lets the user see their situation from a step away and correct misreadings on the spot.
    links:
      - { label: 위키백과 — Reflective listening, label_en: Wikipedia — Reflective listening, url: "https://en.wikipedia.org/wiki/Reflective_listening", source: wikipedia }
      - { label: 위키백과 — Person-centered therapy, label_en: Wikipedia — Person-centered therapy, url: "https://en.wikipedia.org/wiki/Person-centered_therapy", source: wikipedia }
      - { label: APA 사전 — reflective listening, label_en: APA Dictionary — reflective listening, url: "https://dictionary.apa.org/reflective-listening", source: apa }
      - { label: APA 사전 — person-centered therapy, label_en: APA Dictionary — person-centered therapy, url: "https://dictionary.apa.org/person-centered-therapy", source: apa }

  day_mapping:
    effect:
      ko: 하루를 시간과 영역으로 나눠 놓으면 "그냥 안 좋았다"가 "오후 회의 뒤부터"로 좁혀진다. 기분과 활동의 연결을 눈으로 확인할 수 있어 다음 단계(탐지)가 쉬워진다.
      en: Splitting the day by time and domain narrows "it was bad" to "after the afternoon meeting".
    links:
      - { label: APA 사전 — activity scheduling, label_en: APA Dictionary — activity scheduling, url: "https://dictionary.apa.org/activity-scheduling", source: apa }
      - { label: 위키백과 — Behavioral activation, label_en: Wikipedia — Behavioral activation, url: "https://en.wikipedia.org/wiki/Behavioral_activation", source: wikipedia }
      - { label: NHS — 인지행동치료(CBT) 개요, label_en: NHS — CBT overview, url: "https://www.nhs.uk/mental-health/talking-therapies-medicine-treatments/talking-therapies-and-counselling/cognitive-behavioural-therapy-cbt/overview/", source: nhs }

  domain_scan:
    effect:
      ko: 영역마다 따로 점수를 매기면 전체 평균에 묻히던 차이가 드러난다. "일은 괜찮은데 관계가 낮다"처럼 어디를 볼지 정하는 근거가 된다.
      en: Scoring each domain separately exposes gaps that an overall average hides.
    links:
      - { label: 위키백과 — Solution-focused brief therapy, label_en: Wikipedia — Solution-focused brief therapy, url: "https://en.wikipedia.org/wiki/Solution-focused_brief_therapy", source: wikipedia }
      - { label: APA 사전 — solution-focused brief therapy, label_en: APA Dictionary — solution-focused brief therapy, url: "https://dictionary.apa.org/solution-focused-brief-therapy", source: apa }

  spillover_check:
    effect:
      ko: 한 영역의 일이 다른 영역으로 번졌는지 확인하면 원인을 엉뚱한 곳에서 찾는 일이 줄어든다. 예를 들어 관계 점수가 낮은 이유가 실은 일에서 온 피로일 수 있다.
      en: Checking whether one domain bled into another keeps the search for causes from landing in the wrong place.
    links:
      - { label: 위키백과 — Work–family conflict, label_en: Wikipedia — Work–family conflict, url: "https://en.wikipedia.org/wiki/Work%E2%80%93family_conflict", source: wikipedia }
      - { label: 위키백과 — Work–life balance, label_en: Wikipedia — Work–life balance, url: "https://en.wikipedia.org/wiki/Work%E2%80%93life_balance", source: wikipedia }
      - { label: APA 사전 — spillover, label_en: APA Dictionary — spillover, url: "https://dictionary.apa.org/spillover", source: apa }

  baseline_delta:
    effect:
      ko: 남과 비교하지 않고 본인의 평소값과 비교한다. 절대 점수가 3점이라도 평소가 4~5점이면 급락으로 잡히고, 평소 2점대라면 오히려 나아진 날로 읽힌다.
      en: Compares today against your own baseline rather than a population norm.
    links:
      - { label: 위키백과 — Single-subject design, label_en: Wikipedia — Single-subject design, url: "https://en.wikipedia.org/wiki/Single-subject_design", source: wikipedia }
      - { label: 위키백과 — N of 1 trial, label_en: Wikipedia — N of 1 trial, url: "https://en.wikipedia.org/wiki/N_of_1_trial", source: wikipedia }
      - { label: APA 사전 — baseline, label_en: APA Dictionary — baseline, url: "https://dictionary.apa.org/baseline", source: apa }

  prescription_followup:
    effect:
      ko: 어제 정한 행동을 오늘 확인하면 기록이 일기에서 루프로 바뀐다. 실행 여부를 스스로 점검하는 것만으로도 행동이 이어질 확률이 올라간다.
      en: Checking yesterday's action today turns a diary into a loop; self-monitoring alone raises follow-through.
    links:
      - { label: APA 사전 — self-monitoring, label_en: APA Dictionary — self-monitoring, url: "https://dictionary.apa.org/self-monitoring", source: apa }
      - { label: 위키백과 — Homework in psychotherapy, label_en: Wikipedia — Homework in psychotherapy, url: "https://en.wikipedia.org/wiki/Homework_in_psychotherapy", source: wikipedia }

  agenda_setting:
    effect:
      ko: 오늘 다룰 항목을 하나로 정하면 5분 안에 끝낼 수 있고, 여러 문제를 얕게 훑다 끝나는 일을 막는다. 무엇을 다룰지 사용자가 정하므로 납득도 높다.
      en: Picking one focus keeps the session short and prevents skimming several problems shallowly.
    links:
      - { label: Beck Institute — CBT 이해하기, label_en: Beck Institute — Understanding CBT, url: "https://beckinstitute.org/about/understanding-cbt/", source: official }
      - { label: 위키백과 — Cognitive behavioral therapy, label_en: Wikipedia — Cognitive behavioral therapy, url: "https://en.wikipedia.org/wiki/Cognitive_behavioral_therapy", source: wikipedia }
      - { label: 위키백과 — 인지행동치료 (한국어), label_en: Wikipedia — Cognitive behavioral therapy (Korean), url: "https://ko.wikipedia.org/wiki/%EC%9D%B8%EC%A7%80%ED%96%89%EB%8F%99%EC%B9%98%EB%A3%8C", source: wikipedia }

  trigger_mapping:
    effect:
      ko: 낮은 점수가 언제, 어떤 상황에서 시작됐는지 특정하면 "하루 종일 안 좋았다"는 막연함이 사라진다. 이후의 원인 분석이 구체적인 사건 하나를 붙잡고 진행된다.
      en: Pinning down when and where a low score began replaces vagueness with one concrete event to work on.
    links:
      - { label: 위키백과 — Functional analysis (psychology), label_en: Wikipedia — Functional analysis (psychology), url: "https://en.wikipedia.org/wiki/Functional_analysis_(psychology)", source: wikipedia }
      - { label: APA 사전 — functional analysis, label_en: APA Dictionary — functional analysis, url: "https://dictionary.apa.org/functional-analysis", source: apa }

  cbt_thought_record:
    effect:
      ko: 상황 → 생각 → 감정 → 행동을 순서대로 적으면 감정이 어디서 왔는지 보인다. 자동으로 스친 생각을 문장으로 꺼내 놓는 것만으로 그 생각의 힘이 줄어드는 경우가 많다.
      en: Writing situation → thought → feeling → action in order shows where the feeling came from.
    links:
      - { label: NHS — 인지행동치료(CBT) 개요, label_en: NHS — CBT overview, url: "https://www.nhs.uk/mental-health/talking-therapies-medicine-treatments/talking-therapies-and-counselling/cognitive-behavioural-therapy-cbt/overview/", source: nhs }
      - { label: APA — 인지행동치료란, label_en: APA — What is CBT, url: "https://www.apa.org/ptsd-guideline/patients-and-families/cognitive-behavioral", source: apa }
      - { label: 위키백과 — Cognitive behavioral therapy, label_en: Wikipedia — Cognitive behavioral therapy, url: "https://en.wikipedia.org/wiki/Cognitive_behavioral_therapy", source: wikipedia }

  affect_labeling:
    effect:
      ko: 감정에 정확한 이름을 붙이면 그 감정의 강도가 다소 누그러진다는 실험 결과가 있다. "그냥 안 좋다"보다 "조급함"이라고 말할 때 다음 질문이 가능해진다.
      en: Naming an emotion precisely tends to reduce its intensity and makes the next question possible.
    links:
      - { label: 위키백과 — Affect labeling, label_en: Wikipedia — Affect labeling, url: "https://en.wikipedia.org/wiki/Affect_labeling", source: wikipedia }
      - { label: APA 사전 — affect labeling, label_en: APA Dictionary — affect labeling, url: "https://dictionary.apa.org/affect-labeling", source: apa }

  cognitive_distortion_check:
    effect:
      ko: 스친 생각이 흑백 사고나 과잉 일반화 같은 익숙한 치우침에 해당하는지 대보면, 생각을 사실이 아니라 하나의 해석으로 다룰 수 있게 된다.
      en: Checking a thought against known distortions lets you treat it as one interpretation rather than fact.
    links:
      - { label: 위키백과 — Cognitive distortion, label_en: Wikipedia — Cognitive distortion, url: "https://en.wikipedia.org/wiki/Cognitive_distortion", source: wikipedia }
      - { label: APA 사전 — cognitive distortion, label_en: APA Dictionary — cognitive distortion, url: "https://dictionary.apa.org/cognitive-distortion", source: apa }

  evidence_check:
    effect:
      ko: 그 생각을 뒷받침하는 근거와 반대 근거를 나란히 놓으면 결론을 강요하지 않고도 사용자가 스스로 생각을 수정한다. 설득보다 오래 간다.
      en: Laying evidence for and against side by side lets the user revise the thought themselves.
    links:
      - { label: 위키백과 — Socratic questioning, label_en: Wikipedia — Socratic questioning, url: "https://en.wikipedia.org/wiki/Socratic_questioning", source: wikipedia }
      - { label: 위키백과 — Cognitive restructuring, label_en: Wikipedia — Cognitive restructuring, url: "https://en.wikipedia.org/wiki/Cognitive_restructuring", source: wikipedia }
      - { label: APA 사전 — guided discovery, label_en: APA Dictionary — guided discovery, url: "https://dictionary.apa.org/guided-discovery", source: apa }

  five_whys:
    effect:
      ko: '"왜"를 몇 겹 따라 내려가면 겉으로 보이는 이유(늦게 잤다) 아래의 바꿀 수 있는 지점(멈출 시각을 정하지 않았다)에 닿는다. 다섯 번을 채우는 것이 목적이 아니라 더 쪼개지지 않는 곳에서 멈춘다.'
      en: Following "why" a few layers down reaches a changeable point beneath the surface reason.
    links:
      - { label: 위키백과 — Five whys, label_en: Wikipedia — Five whys, url: "https://en.wikipedia.org/wiki/Five_whys", source: wikipedia }
      - { label: 도요타 — 생산 시스템(TPS), label_en: Toyota — Production System (TPS), url: "https://global.toyota/en/company/vision-and-philosophy/production-system/", source: official }

  exception_question:
    effect:
      ko: 같은 상황인데 괜찮았던 날을 찾으면 "그날은 뭐가 달랐나"에서 바로 처방이 나온다. 문제가 아니라 이미 되고 있는 것에서 출발하므로 부담이 적다.
      en: Finding a day the problem didn't happen turns "what was different" straight into a prescription.
    links:
      - { label: 위키백과 — Solution-focused brief therapy, label_en: Wikipedia — Solution-focused brief therapy, url: "https://en.wikipedia.org/wiki/Solution-focused_brief_therapy", source: wikipedia }
      - { label: APA 사전 — solution-focused brief therapy, label_en: APA Dictionary — solution-focused brief therapy, url: "https://dictionary.apa.org/solution-focused-brief-therapy", source: apa }

  values_check:
    effect:
      ko: 낮은 점수가 본인이 중요하게 여기는 것과 어긋나서 생긴 것인지 확인하면, 처방이 "해야 해서"가 아니라 "그게 나한테 중요해서"로 붙는다. 그래야 다음 날까지 간다.
      en: Tying a low score to what you actually value makes the prescription stick past tomorrow.
    links:
      - { label: WHO — Doing What Matters in Times of Stress (ACT 기반 자가 안내서), label_en: WHO — Doing What Matters in Times of Stress (ACT-based self-help guide), url: "https://www.who.int/publications/i/item/9789240003927", source: who }
      - { label: 위키백과 — Acceptance and commitment therapy, label_en: Wikipedia — Acceptance and commitment therapy, url: "https://en.wikipedia.org/wiki/Acceptance_and_commitment_therapy", source: wikipedia }
      - { label: 위키백과 — 수용전념치료 (한국어), label_en: Wikipedia — Acceptance and commitment therapy (Korean), url: "https://ko.wikipedia.org/wiki/%EC%88%98%EC%9A%A9%EC%A0%84%EB%85%90%EC%B9%98%EB%A3%8C", source: wikipedia }
      - { label: APA 사전 — acceptance and commitment therapy, label_en: APA Dictionary — acceptance and commitment therapy, url: "https://dictionary.apa.org/acceptance-and-commitment-therapy", source: apa }

  control_dichotomy:
    effect:
      ko: 원인 중 내가 바꿀 수 있는 것과 없는 것을 갈라 놓으면, 바꿀 수 없는 쪽에 쓰던 힘을 거두고 바꿀 수 있는 한 지점에 처방을 집중할 수 있다.
      en: Separating what you can change from what you can't focuses the prescription on the changeable part.
    links:
      - { label: 스탠퍼드 철학 백과 — Epictetus, label_en: Stanford Encyclopedia of Philosophy — Epictetus, url: "https://plato.stanford.edu/entries/epictetus/", source: stanford }
      - { label: 인터넷 철학 백과(IEP) — Epictetus, label_en: Internet Encyclopedia of Philosophy — Epictetus, url: "https://iep.utm.edu/epictetu/", source: iep }
      - { label: 위키백과 — Enchiridion of Epictetus, label_en: Wikipedia — Enchiridion of Epictetus, url: "https://en.wikipedia.org/wiki/Enchiridion_of_Epictetus", source: wikipedia }
      - { label: 위키백과 — 에픽테토스 (한국어), label_en: Wikipedia — Epictetus (Korean), url: "https://ko.wikipedia.org/wiki/%EC%97%90%ED%94%BD%ED%85%8C%ED%86%A0%EC%8A%A4", source: wikipedia }

  summary_validation:
    effect:
      ko: 결론을 내리기 전에 지금까지 들은 것을 요약해 확인받으면 에이전트가 지어낸 해석이 기록에 들어가는 것을 막는다. 사용자가 "그건 아니야"라고 고칠 수 있는 마지막 지점이다.
      en: Summarizing before concluding gives the user a last chance to correct the picture before it is saved.
    links:
      - { label: 위키백과 — Motivational interviewing, label_en: Wikipedia — Motivational interviewing, url: "https://en.wikipedia.org/wiki/Motivational_interviewing", source: wikipedia }
      - { label: MINT — 동기면담 이해하기, label_en: MINT — Understanding Motivational Interviewing, url: "https://motivationalinterviewing.org/understanding-motivational-interviewing", source: official }

  alternative_hypothesis:
    effect:
      ko: 첫 번째 해석 옆에 다른 설명을 하나 더 세워 보면, 가장 그럴듯한 이유가 아니라 실제 이유를 고를 수 있다. 처방이 엉뚱한 원인에 붙는 것을 막는다.
      en: Putting a second explanation next to the first helps pick the real cause, not the most plausible-sounding one.
    links:
      - { label: 위키백과 — Cognitive restructuring, label_en: Wikipedia — Cognitive restructuring, url: "https://en.wikipedia.org/wiki/Cognitive_restructuring", source: wikipedia }
      - { label: APA 사전 — cognitive restructuring, label_en: APA Dictionary — cognitive restructuring, url: "https://dictionary.apa.org/cognitive-restructuring", source: apa }

  behavioral_activation:
    effect:
      ko: 기분이 나아지길 기다렸다가 움직이는 대신, 작은 행동을 먼저 하면 기분이 따라온다는 순서를 쓴다. 우울 개입에서 반복 검증된 접근이다.
      en: Acting first and letting mood follow, rather than waiting to feel better before moving.
    links:
      - { label: 위키백과 — Behavioral activation, label_en: Wikipedia — Behavioral activation, url: "https://en.wikipedia.org/wiki/Behavioral_activation", source: wikipedia }
      - { label: APA 사전 — behavioral activation, label_en: APA Dictionary — behavioral activation, url: "https://dictionary.apa.org/behavioral-activation", source: apa }
      - { label: NHS — 인지행동치료(CBT) 개요, label_en: NHS — CBT overview, url: "https://www.nhs.uk/mental-health/talking-therapies-medicine-treatments/talking-therapies-and-counselling/cognitive-behavioural-therapy-cbt/overview/", source: nhs }

  tiny_habit:
    effect:
      ko: 처방을 실패할 수 없을 만큼 작게 쪼개면 "내일 실제로 하게 될" 확률이 크게 올라간다. 시작하는 데 드는 힘을 줄이는 것이 핵심이다.
      en: Shrinking a prescription until it can't fail makes it far more likely to actually happen tomorrow.
    links:
      - { label: Tiny Habits — BJ 포그 공식 사이트, label_en: Tiny Habits — BJ Fogg's official site, url: "https://tinyhabits.com/", source: official }
      - { label: Fogg Behavior Model, url: "https://behaviormodel.org/", source: official }
      - { label: 위키백과 — BJ Fogg, label_en: Wikipedia — BJ Fogg, url: "https://en.wikipedia.org/wiki/BJ_Fogg", source: wikipedia }

  implementation_intention:
    effect:
      ko: '"내일 언제, 어디서" 할지 미리 정해 두면 그 상황이 왔을 때 별도의 결심 없이 행동이 나온다. 목표만 세운 경우보다 실행률이 높다는 연구가 여럿 있다.'
      en: Deciding "when and where" in advance triggers the action without a fresh decision in the moment.
    links:
      - { label: 위키백과 — Implementation intention, label_en: Wikipedia — Implementation intention, url: "https://en.wikipedia.org/wiki/Implementation_intention", source: wikipedia }
      - { label: APA 사전 — implementation intention, label_en: APA Dictionary — implementation intention, url: "https://dictionary.apa.org/implementation-intention", source: apa }

  three_good_things:
    effect:
      ko: 하루에서 좋았던 것 세 가지를 꺼내 보면 낮은 점수만 파고든 날의 균형을 잡을 수 있다. 꾸준히 하면 기분과 만족감이 나아진다는 연구가 있다.
      en: Recalling three good things balances a session that dug only into the low points.
    links:
      - { label: Greater Good in Action (UC 버클리) — Three Good Things, label_en: Greater Good in Action (UC Berkeley) — Three Good Things, url: "https://ggia.berkeley.edu/practice/three-good-things", source: official }
      - { label: 위키백과 — Positive psychology, label_en: Wikipedia — Positive psychology, url: "https://en.wikipedia.org/wiki/Positive_psychology", source: wikipedia }
      - { label: 위키백과 — 긍정심리학 (한국어), label_en: Wikipedia — Positive psychology (Korean), url: "https://ko.wikipedia.org/wiki/%EA%B8%8D%EC%A0%95%EC%8B%AC%EB%A6%AC%ED%95%99", source: wikipedia }
      - { label: 위키백과 — Gratitude journal, label_en: Wikipedia — Gratitude journal, url: "https://en.wikipedia.org/wiki/Gratitude_journal", source: wikipedia }

  self_compassion:
    effect:
      ko: 못 한 날을 자책 대신 친구에게 하듯 대하면 다음 날 다시 시도할 힘이 남는다. 자기비판이 실행률을 오히려 떨어뜨린다는 점을 보완한다.
      en: Treating a missed day the way you'd treat a friend leaves energy to try again tomorrow.
    links:
      - { label: Self-Compassion — 크리스틴 네프 공식 사이트, label_en: Self-Compassion — Kristin Neff's official site, url: "https://self-compassion.org/", source: official }
      - { label: 위키백과 — Self-compassion, label_en: Wikipedia — Self-compassion, url: "https://en.wikipedia.org/wiki/Self-compassion", source: wikipedia }
      - { label: APA 사전 — self-compassion, label_en: APA Dictionary — self-compassion, url: "https://dictionary.apa.org/self-compassion", source: apa }

  pattern_review:
    effect:
      ko: 며칠치 기록을 모아 보면 하루 단위로는 보이지 않던 반복("수요일마다 낮다", "잠이 낮은 다음 날 실행이 낮다")이 드러난다. 처방을 하루짜리가 아니라 습관 수준으로 올릴 수 있다.
      en: Looking across days reveals repeats invisible in any single day.
    links:
      - { label: 위키백과 — Ecological momentary assessment, label_en: Wikipedia — Ecological momentary assessment, url: "https://en.wikipedia.org/wiki/Ecological_momentary_assessment", source: wikipedia }
      - { label: 위키백과 — Quantified self, label_en: Wikipedia — Quantified self, url: "https://en.wikipedia.org/wiki/Quantified_self", source: wikipedia }
      - { label: APA 사전 — self-monitoring, label_en: APA Dictionary — self-monitoring, url: "https://dictionary.apa.org/self-monitoring", source: apa }

  within_day_shift:
    effect:
      ko: 하루 안에서 언제 오르고 내렸는지 보면 "오후 3시 이후"처럼 시간대에 붙은 원인을 찾을 수 있다. 하루를 한 점수로 뭉개지 않게 한다.
      en: Seeing when the day rose and fell locates causes tied to a time of day.
    links:
      - { label: 위키백과 — Experience sampling method, label_en: Wikipedia — Experience sampling method, url: "https://en.wikipedia.org/wiki/Experience_sampling_method", source: wikipedia }
      - { label: APA 사전 — experience sampling method, label_en: APA Dictionary — experience sampling method, url: "https://dictionary.apa.org/experience-sampling-method", source: apa }
      - { label: 위키백과 — Mihaly Csikszentmihalyi, label_en: Wikipedia — Mihaly Csikszentmihalyi, url: "https://en.wikipedia.org/wiki/Mihaly_Csikszentmihalyi", source: wikipedia }

  decatastrophizing:
    effect:
      ko: 걱정을 "최악·최선·가장 그럴듯한 경우"로 나누면 머릿속에서 최악만 크게 보이던 것이 제자리를 찾는다. 최악이 와도 할 수 있는 일이 있다는 것을 확인하면 걱정의 크기가 줄어든다.
      en: Splitting a worry into worst, best, and likely cases puts the worst case back in proportion, and finding a way to cope with it shrinks the worry.
    links:
      - { label: APA 사전 — decatastrophizing, label_en: APA Dictionary — decatastrophizing, url: "https://dictionary.apa.org/decatastrophizing", source: apa }
      - { label: APA 사전 — catastrophizing, label_en: APA Dictionary — catastrophizing, url: "https://dictionary.apa.org/catastrophizing", source: apa }
      - { label: 위키백과 — Decatastrophizing, label_en: Wikipedia — Decatastrophizing, url: "https://en.wikipedia.org/wiki/Decatastrophizing", source: wikipedia }
      - { label: Psychology Tools — Decatastrophizing 워크시트, label_en: Psychology Tools — Decatastrophizing worksheet, url: "https://www.psychologytools.com/resource/decatastrophizing/", source: other }

  problem_solving:
    effect:
      ko: 첫 번째로 떠오른 방법에 바로 붙지 않고 후보를 두세 개 더 꺼낸 뒤 고르면, 실제로 하게 될 확률이 높은 쪽을 고를 수 있다. 우울과 불안에서 반복 검증된 절차다.
      en: Listing two or three options before choosing, instead of grabbing the first, makes it more likely you pick the one you'll actually do.
    links:
      - { label: 위키백과 — Problem-solving therapy, label_en: Wikipedia — Problem-solving therapy, url: "https://en.wikipedia.org/wiki/Problem-solving_therapy", source: wikipedia }
      - { label: APA 사전 — problem-solving therapy, label_en: APA Dictionary — problem-solving therapy, url: "https://dictionary.apa.org/problem-solving-therapy", source: apa }
      - { label: APA 사전 — problem-solving training, label_en: APA Dictionary — problem-solving training, url: "https://dictionary.apa.org/problem-solving-training", source: apa }

  behavioral_experiment:
    effect:
      ko: 머릿속에서 증거를 따지는 것만으로 결론이 안 나는 생각은, 작게 해 보고 결과를 보는 편이 빠르다. 예상 결과를 먼저 적어 두면 다음에 실제 결과와 견줄 수 있다.
      en: A thought that arguing over evidence can't settle is often settled faster by a small real-world test, with the prediction written down first.
    links:
      - { label: APA 사전 — behavioral experiment, label_en: APA Dictionary — behavioral experiment, url: "https://dictionary.apa.org/behavioral-experiment", source: apa }
      - { label: Psychology Tools — Behavioral experiment 워크시트, label_en: Psychology Tools — Behavioral experiment worksheet, url: "https://www.psychologytools.com/resource/behavioral-experiment/", source: other }
      - { label: 위키백과 — Cognitive behavioral therapy, label_en: Wikipedia — Cognitive behavioral therapy, url: "https://en.wikipedia.org/wiki/Cognitive_behavioral_therapy", source: wikipedia }
      - { label: 위키백과 — 인지행동치료 (한국어), label_en: Wikipedia — Cognitive behavioral therapy (Korean), url: "https://ko.wikipedia.org/wiki/%EC%9D%B8%EC%A7%80%ED%96%89%EB%8F%99%EC%B9%98%EB%A3%8C", source: wikipedia }

  obstacle_plan:
    effect:
      ko: 못 지킨 처방은 대개 의지가 아니라 막는 것을 미리 보지 않아서다. 무엇이 막을지를 먼저 떠올리고 "그러면 어떻게 한다"를 붙여 두면 실행률이 올라간다는 연구가 20년 넘게 쌓여 있다.
      en: Missed actions usually come from not seeing the obstacle in advance; naming it and attaching an if-then raises follow-through.
    links:
      - { label: WOOP — 외팅겐 공식 사이트, label_en: WOOP — Oettingen's official site, url: "https://woopmylife.org/", source: official }
      - { label: APA 사전 — mental contrasting, label_en: APA Dictionary — mental contrasting, url: "https://dictionary.apa.org/mental-contrasting", source: apa }
      - { label: 위키백과 — Gabriele Oettingen, label_en: Wikipedia — Gabriele Oettingen, url: "https://en.wikipedia.org/wiki/Gabriele_Oettingen", source: wikipedia }
      - { label: 위키백과 — Implementation intention, label_en: Wikipedia — Implementation intention, url: "https://en.wikipedia.org/wiki/Implementation_intention", source: wikipedia }

  early_warning_signs:
    effect:
      ko: 나빠지기 전에 먼저 오는 신호("잠이 줄면 이틀 뒤 일이 무너진다")를 자기 말로 적어 두면, 다음에 그 신호가 보였을 때 2주를 기다리지 않고 알아차릴 수 있다. 예측이 아니라 알아차림을 위한 목록이다.
      en: Writing down, in your own words, what tends to come before a slump lets you notice it next time without waiting two weeks.
    links:
      - { label: 위키백과 — Relapse prevention, label_en: Wikipedia — Relapse prevention, url: "https://en.wikipedia.org/wiki/Relapse_prevention", source: wikipedia }
      - { label: APA 사전 — relapse prevention, label_en: APA Dictionary — relapse prevention, url: "https://dictionary.apa.org/relapse-prevention", source: apa }
      - { label: Stanley-Brown 안전 계획 (공식), label_en: Stanley-Brown Safety Plan (official), url: "https://suicidesafetyplan.com/", source: official }
      - { label: NIMH — 자살 예방, label_en: NIMH — Suicide prevention, url: "https://www.nimh.nih.gov/health/topics/suicide-prevention", source: nimh }

  cognitive_defusion:
    effect:
      ko: 며칠째 붙어 있는 생각을 지우려고 다투는 대신 "그런 생각을 하고 있다"로 떨어져서 보면, 생각의 내용은 그대로여도 그 생각이 나를 끌고 다니는 힘이 줄어든다. 생각의 내용이 아니라 생각과의 관계를 바꾸는 절차다.
      en: Watching a sticky thought as a thought, instead of fighting its content, loosens its grip even while the content stays the same.
    links:
      - { label: WHO — Doing What Matters in Times of Stress (ACT 기반 자가 안내서), label_en: WHO — Doing What Matters in Times of Stress (ACT-based self-help guide), url: "https://www.who.int/publications/i/item/9789240003927", source: who }
      - { label: 위키백과 — Acceptance and commitment therapy, label_en: Wikipedia — Acceptance and commitment therapy, url: "https://en.wikipedia.org/wiki/Acceptance_and_commitment_therapy", source: wikipedia }
      - { label: 위키백과 — 수용전념치료 (한국어), label_en: Wikipedia — Acceptance and commitment therapy (Korean), url: "https://ko.wikipedia.org/wiki/%EC%88%98%EC%9A%A9%EC%A0%84%EB%85%90%EC%B9%98%EB%A3%8C", source: wikipedia }
